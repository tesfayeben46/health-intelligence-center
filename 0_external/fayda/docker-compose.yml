# Fayda Replica: stand-in for the Fayda national-ID OIDC IdP, external to the
# k8s cluster like every 0_external/ system (in production Fayda is a third party).
#
# Published on 0.0.0.0:8096 so both consumers reach it:
#   · the public dashboard pod (in k8s)  -> http://host.k3d.internal:8096
#   · the citizen's browser (popup)      -> http://localhost:8096
# The app listens on 8000 inside the container.
services:
  fayda:
    build: .
    image: nhdw/fayda-replica:1.0.0
    container_name: fayda-replica
    restart: unless-stopped
    # Fayda's own SMTP: the OTP mailer for the access-request identity check.
    # Values are interpolated from ./.env (auto-loaded by compose; see
    # .env.template), separate from the NHDW gateway's smtp-secrets. Without
    # ./.env the vars are empty and email is skipped (the OTP is still generated
    # and logged).
    environment:
      FAYDA_ISSUER: "http://localhost:8096"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_TLS: "${SMTP_TLS:-true}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-Fayda Verification <noreply@fayda.local>}"
    ports:
      - "8096:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/.well-known/openid-configuration')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
