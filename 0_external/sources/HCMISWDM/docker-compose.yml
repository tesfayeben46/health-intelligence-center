# HCMIS WDM and mBrana source replica, external to the k8s cluster: stands in
# for the EPSS SQL Server the dlt ingestors pull from. One SQL Server 2025
# instance hosts both databases:
#
#   HCMISWDM     vaccine and medical-supply warehouse data management
#   HCMISWCloud  the mBrana platform database (mBrana, mFlowUSSD, RRF,
#                AdministrativeUnit, dbo, Commodity, USM schemas)
#
# mBrana has no compose file of its own. Once this container is healthy,
# 0_external/sources/mBrana/scripts/restore.sh copies HCMISWCloud.bak in and
# restores it beside HCMISWDM. The mBrana ingestor connects to the same
# host.k3d.internal:1433 with database=HCMISWCloud.
#
# SQL Server 2025 is required: HCMISWDM.bak and HCMISWCloud.bak carry internal
# version 998, above the SQL Server 2019/2022 maximum (957-958). Developer
# edition is licensed for development and demonstration use only.
#
# Seeding (needs the separately distributed schema backups in sample-data/):
#   1. docker compose -f 0_external/sources/HCMISWDM/docker-compose.yml up -d
#   2. wait for the container to report healthy (sqlcmd 'SELECT 1')
#   3. bash 0_external/sources/HCMISWDM/scripts/restore.sh   (HCMISWDM schema + users)
#      bash 0_external/sources/mBrana/scripts/restore.sh     (HCMISWCloud schema + users)
#   4. python3 0_external/sources/HCMISWDM/scripts/synthesize.py, synthesize_analytics.py
#      and synthesize_dispatch.py, then 0_external/sources/mBrana/scripts/synthesize.py
# The in-cluster dlt ingestors then pull TDS through host.k3d.internal:1433.
#
# Ports are published on 0.0.0.0 (not 127.0.0.1) so k3d pods can reach them
# through host.k3d.internal. The stack has no nhdw_net attachment (it is the
# outside world), only a private bridge.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: hcmiswdm-sqlserver   # restore.sh (both HCMISWDM + mBrana) exec into this name
    restart: unless-stopped
    environment:
      SA_PASSWORD: ${HCMISWDM_SA_PASSWORD:-ChangeMe-MUST-be-strong-Aa1!}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Cap the SQL Server memory.
      MSSQL_MEMORY_LIMIT_MB: "5120"
    mem_limit: 6g          # container ceiling above the engine limit: two DBs and large synthetic inserts need headroom (Msg 701 at 2.5 GB)
    ports:
      - "1433:1433"        # 0.0.0.0: reachable from k3d pods through host.k3d.internal
    volumes:
      - hcmiswdm_data:/var/opt/mssql
      # Backups dir is a named volume so restore.sh can docker cp the .bak in
      # (a ./data bind mount is fragile with a symlinked data dir).
      - hcmiswdm_backup:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [hcmiswdm_net]

networks:
  hcmiswdm_net:
    driver: bridge

volumes:
  hcmiswdm_data:
  hcmiswdm_backup:
