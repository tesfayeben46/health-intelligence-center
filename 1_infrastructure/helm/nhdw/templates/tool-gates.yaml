# NHDW tool-gates: role-aware OIDC reverse proxies in front of external tools.
# One nhdw/tool-gate image, deployed once per tool and configured by env
# (UPSTREAM_URL, ALLOWED_ROLES, OIDC client). Each gate provides shared-session
# auto-login, per-tool role enforcement (403 for a disallowed role) and direct
# login with the same credentials. A plain forward-auth proxy would admit any
# valid session regardless of role.
# mlflow-gate: fronts the MLflow tracking and registry UI. A data-science tool,
# open to scientists, researchers, analysts and admins from either staff realm.
apiVersion: apps/v1
kind: Deployment
metadata: { name: mlflow-gate, namespace: {{ .Values.namespace }}, labels: { app: mlflow-gate, tier: tool-sso } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mlflow-gate } }
  template:
    metadata: { labels: { app: mlflow-gate, tier: tool-sso } }
    spec:
      containers:
        - name: gate
          image: {{ include "nhdw.image" (dict "name" "tool-gate" "ctx" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [ { containerPort: 80, name: http } ]
          env:
            - { name: TOOL_NAME,           value: "mlflow" }
            - { name: UPSTREAM_URL,        value: "http://mlflow.{{ .Values.namespace }}.svc.cluster.local:5000" }
            - { name: ALLOWED_ROLES,       value: "R-CONS-SCI,R-CONS-RES,R-CONS-ANA,R-OPS-ADM,R-SUPER" }
            - { name: OIDC_REALMS,         value: "moh-staff,privileged-ops" }
            - { name: OIDC_CLIENT_ID,      value: "mlflow" }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: mlflow-gate-secrets, key: OIDC_CLIENT_SECRET, optional: true } }
            - { name: OIDC_REDIRECT_URI,   value: "https://mlflow.{{ .Values.hostBase }}/oauth2gate/callback" }
            - { name: APP_BASE,            value: "https://mlflow.{{ .Values.hostBase }}" }
            - { name: KEYCLOAK_BASE,        value: "http://keycloak.{{ .Values.namespace }}.svc.cluster.local:8080" }
            - { name: KEYCLOAK_PUBLIC_BASE, value: "https://keycloak.{{ .Values.hostBase }}" }
            - { name: LOKI_URL,            value: "http://loki.{{ .Values.namespace }}.svc.cluster.local:3100" }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: mlflow-gate-secrets, key: SESSION_SECRET, optional: true } }
          readinessProbe: { httpGet: { path: /oauth2gate/health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /oauth2gate/health, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: mlflow-gate, namespace: {{ .Values.namespace }}, labels: { app: mlflow-gate } }
spec:
  selector: { app: mlflow-gate }
  ports: [ { port: 80, targetPort: http, name: http } ]
