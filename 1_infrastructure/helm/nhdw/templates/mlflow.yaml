# MLflow tracking server.
#
# Backend store : postgres-vault / nhdw_mlflow (writer = mlflow_writer)
# Artifact store: s3://nhdw-artifacts/mlflow/ on SeaweedFS
#                 (identity `mlflow` in seaweedfs-secrets identities.json)
#
# Image is built from 3_storage/model-registry/Dockerfile and published as
# nhdw/mlflow.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: {{ .Values.namespace }}
  labels: { app: mlflow, tier: ml }
spec:
  replicas: 1
  selector: { matchLabels: { app: mlflow } }
  template:
    metadata:
      labels: { app: mlflow, tier: ml }
    spec:
      containers:
        - name: mlflow
          image: {{ include "nhdw.image" (dict "name" "mlflow" "ctx" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [ { containerPort: 5000, name: http } ]
          env:
            - { name: MLFLOW_HOST,        value: "0.0.0.0" }
            - { name: MLFLOW_PORT,        value: "5000" }
            - { name: MLFLOW_WORKERS,     value: "2" }
            - { name: MLFLOW_DB_HOST,     value: "postgres-vault.{{ .Values.namespace }}.svc.cluster.local" }
            - { name: MLFLOW_DB_PORT,     value: "5432" }
            - { name: MLFLOW_DB_USER,     value: "mlflow_writer" }
            - { name: MLFLOW_DB_NAME,     value: "nhdw_mlflow" }
            - name:  MLFLOW_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-vault-secrets, key: MLFLOW_DB_PASSWORD } }
            - { name: MLFLOW_DEFAULT_ARTIFACT_ROOT, value: "s3://nhdw-artifacts/mlflow" }
            - { name: MLFLOW_S3_ENDPOINT_URL,       value: "http://seaweedfs-s3.{{ .Values.namespace }}.svc.cluster.local:8333" }
            - { name: BOTO_EXPERIMENTAL__NO_EMPTY_CONTINUE, value: "true" }
            - { name: MLFLOW_S3_IGNORE_TLS,         value: "true" }
            - { name: AWS_DEFAULT_REGION,           value: "et-addis-1" }
            - name:  AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: mlflow-secrets, key: S3_ACCESS_KEY } }
            - name:  AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: mlflow-secrets, key: S3_SECRET_KEY } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: {{ .Values.namespace }}
  labels: { app: mlflow, tier: ml }
spec:
  type: ClusterIP
  selector: { app: mlflow }
  ports:
    - { port: 5000, targetPort: http, name: http }
