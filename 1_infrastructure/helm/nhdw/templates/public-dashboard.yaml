{{- $c := index .Values.components "public-dashboard" -}}
apiVersion: apps/v1
kind: Deployment
metadata: { name: public-dashboard, namespace: {{ .Values.namespace }}, labels: { app: public-dashboard, tier: dashboard } }
spec:
  replicas: {{ $c.replicas }}
  selector: { matchLabels: { app: public-dashboard } }
  template:
    metadata: { labels: { app: public-dashboard, tier: dashboard } }
    spec:
      containers:
        - name: dashboard
          image: {{ include "nhdw.image" (dict "name" "public-dashboard" "ctx" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [ { containerPort: 80, name: http } ]
          env:
            # The public portal is anonymous (no OIDC). Fayda identity verification (email OTP)
            # is handled by the external Fayda replica; /api/proxy/fayda/* forwards there. In
            # production this points at the real Fayda service. NHDW_BASE_DOMAIN comes first to
            # match the overlay's strategic-merge order, so Helm and kustomize render identically.
            - { name: NHDW_BASE_DOMAIN,    value: {{ .Values.hostBase | quote }} }
            - { name: FAYDA_INTERNAL_BASE, value: {{ .Values.fayda.internalBase | quote }} }
          {{- with $c.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 3, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: public-dashboard, namespace: {{ .Values.namespace }}, labels: { app: public-dashboard } }
spec:
  selector: { app: public-dashboard }
  ports: [ { port: 80, targetPort: http, name: http } ]
