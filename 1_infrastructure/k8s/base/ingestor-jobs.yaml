# Source ingestor Jobs: dlt ingestors that pull each external compose source replica
# into the data lake (nhdw-raw on SeaweedFS). Run by seed-realistic.sh after
# seaweedfs-init and before ch-raw-views. They reach the host-published source ports
# through host.k3d.internal (k3d injects it into CoreDNS; bootstrap.sh and the
# provision role verify or add it).
#
# Registry image names are remapped to the local nhdw/* images by k8s/jobs/. Source
# DB/API credentials come from the `source-creds` Secret (overlays/dev/secrets.yaml);
# object-store credentials from `minio-secrets` (historical name). These Jobs are not
# part of the base deploy; they are one-shot pipeline steps run through run_job(). Each
# Job is self-contained: YAML anchors do not cross `---` document boundaries, and a list
# anchor cannot be spliced into an env list.
---
apiVersion: batch/v1
kind: Job
metadata: { name: dhis2-ingest-metadata, namespace: nhdw, labels: { app: dhis2-ingestor, tier: pipeline } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app: dhis2-ingestor, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ingestor
          image: nhdw-registry:5500/nhdw/dhis2-ingestor:1.0.0
          imagePullPolicy: Always
          args: ["metadata"]
          env:
            - { name: DHIS2_BASE_URL, value: "http://host.k3d.internal:8080" }
            - { name: DHIS2_USER,     valueFrom: { secretKeyRef: { name: source-creds, key: DHIS2_USER } } }
            - { name: DHIS2_PASSWORD, valueFrom: { secretKeyRef: { name: source-creds, key: DHIS2_PASSWORD } } }
            - { name: DHIS2_PAGE_SIZE, value: "200" }
            - { name: MINIO_ENDPOINT,   value: "http://seaweedfs-s3.nhdw.svc.cluster.local:8333" }   # SeaweedFS S3 gateway
            - { name: BOTO_EXPERIMENTAL__NO_EMPTY_CONTINUE, value: "true" }
            # best-effort catalog lineage (src/lineage.py): both optional; without
            # them the emitter is a no-op
            - { name: OM_LINEAGE_API, value: "http://openmetadata.nhdw.svc.cluster.local:8585/api" }
            - { name: OM_LINEAGE_JWT, valueFrom: { secretKeyRef: { name: openmetadata-secrets, key: INGESTION_BOT_TOKEN, optional: true } } }
            - { name: MINIO_ACCESS_KEY, valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER } } }
            - { name: MINIO_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
            - { name: MINIO_RAW_BUCKET, value: "nhdw-raw" }
            - { name: MINIO_REGION,     value: "et-addis-1" }
---
apiVersion: batch/v1
kind: Job
metadata: { name: dhis2-ingest-dvs, namespace: nhdw, labels: { app: dhis2-ingestor, tier: pipeline } }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app: dhis2-ingestor, tier: pipeline } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ingestor
          image: nhdw-registry:5500/nhdw/dhis2-ingestor:1.0.0
          imagePullPolicy: Always
          args: ["data-value-sets"]
          env:
            - { name: DHIS2_BASE_URL, value: "http://host.k3d.internal:8080" }
            - { name: DHIS2_USER,     valueFrom: { secretKeyRef: { name: source-creds, key: DHIS2_USER } } }
            - { name: DHIS2_PASSWORD, valueFrom: { secretKeyRef: { name: source-creds, key: DHIS2_PASSWORD } } }
            - { name: DHIS2_PAGE_SIZE, value: "200" }
            # Seeded values carry import-time lastUpdated; a low floor takes all on the first run.
            # append + dlt incremental(last_updated): later runs pull only the delta
            # (dlt restores the watermark from lake state), so re-runs do not double-count.
            - { name: DHIS2_INITIAL_LAST_UPDATED, value: "2020-01-01" }
            - { name: MINIO_ENDPOINT,   value: "http://seaweedfs-s3.nhdw.svc.cluster.local:8333" }   # SeaweedFS S3 gateway
            - { name: BOTO_EXPERIMENTAL__NO_EMPTY_CONTINUE, value: "true" }
            # best-effort catalog lineage (src/lineage.py): both optional; without
            # them the emitter is a no-op
            - { name: OM_LINEAGE_API, value: "http://openmetadata.nhdw.svc.cluster.local:8585/api" }
            - { name: OM_LINEAGE_JWT, valueFrom: { secretKeyRef: { name: openmetadata-secrets, key: INGESTION_BOT_TOKEN, optional: true } } }
            - { name: MINIO_ACCESS_KEY, valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_USER } } }
            - { name: MINIO_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-secrets, key: ROOT_PASSWORD } } }
            - { name: MINIO_RAW_BUCKET, value: "nhdw-raw" }
            - { name: MINIO_REGION,     value: "et-addis-1" }
---
