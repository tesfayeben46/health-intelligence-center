# public · anonymous · port 8088
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: public-dashboard, namespace: nhdw, labels: { app: public-dashboard, tier: dashboard } }
spec:
  replicas: 1
  selector: { matchLabels: { app: public-dashboard } }
  template:
    metadata: { labels: { app: public-dashboard, tier: dashboard } }
    spec:
      containers:
        - name: dashboard
          image: nhdw-registry:5500/nhdw/public-dashboard:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 80, name: http } ]
          env:
            - { name: NHDW_MINIO_INTERNAL, value: "http://seaweedfs-s3.nhdw.svc.cluster.local:8333" }   # nhdw-static is read from SeaweedFS; the code default is a legacy host
            # Fayda identity verification is an email-OTP round trip handled
            # entirely by the external Fayda replica (0_external/fayda, compose on
            # host port 8096, like the source replicas). This server's
            # /api/proxy/fayda/* forwards to the replica's /verify/* over the host
            # route; the replica issues, emails and confirms the code with its own
            # SMTP, not the NHDW gateway. Production points this at the real Fayda.
            - { name: FAYDA_INTERNAL_BASE, value: "http://host.k3d.internal:8096" }
          readinessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 3, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: public-dashboard, namespace: nhdw, labels: { app: public-dashboard } }
spec:
  selector: { app: public-dashboard }
  ports: [ { port: 80, targetPort: http, name: http } ]

