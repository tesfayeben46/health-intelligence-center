# NHDW tool gates: role-aware OIDC reverse proxies in front of operator tools.
# One nhdw/tool-gate image, deployed once per tool and configured by env
# (UPSTREAM_URL, ALLOWED_ROLES, OIDC client). Provides shared-session
# auto-login, per-tool role enforcement (403) and direct login with the same
# credentials. Unlike a plain forward-auth proxy, a valid session without an
# allowed role is refused.
# mlflow-gate: fronts the MLflow tracking/registry UI. A data-science tool, so
# scientists, researchers and admins. Accepts a session from either staff realm.
apiVersion: apps/v1
kind: Deployment
metadata: { name: mlflow-gate, namespace: nhdw, labels: { app: mlflow-gate, tier: tool-sso } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mlflow-gate } }
  template:
    metadata: { labels: { app: mlflow-gate, tier: tool-sso } }
    spec:
      containers:
        - name: gate
          image: nhdw-registry:5500/nhdw/tool-gate:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 80, name: http } ]
          env:
            - { name: TOOL_NAME,           value: "mlflow" }
            - { name: UPSTREAM_URL,        value: "http://mlflow.nhdw.svc.cluster.local:5000" }
            - { name: ALLOWED_ROLES,       value: "R-CONS-SCI,R-CONS-RES,R-CONS-ANA,R-OPS-ADM,R-SUPER" }
            - { name: OIDC_REALMS,         value: "moh-staff,privileged-ops" }
            - { name: OIDC_CLIENT_ID,      value: "mlflow" }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: mlflow-gate-secrets, key: OIDC_CLIENT_SECRET, optional: true } }
            - { name: OIDC_REDIRECT_URI,   value: "https://mlflow.127.0.0.1.nip.io/oauth2gate/callback" }
            - { name: APP_BASE,            value: "https://mlflow.127.0.0.1.nip.io" }
            - { name: KEYCLOAK_BASE,        value: "http://keycloak.nhdw.svc.cluster.local:8080" }
            - { name: KEYCLOAK_PUBLIC_BASE, value: "https://keycloak.127.0.0.1.nip.io" }
            - { name: LOKI_URL,            value: "http://loki.nhdw.svc.cluster.local:3100" }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: mlflow-gate-secrets, key: SESSION_SECRET, optional: true } }
          readinessProbe: { httpGet: { path: /oauth2gate/health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /oauth2gate/health, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: mlflow-gate, namespace: nhdw, labels: { app: mlflow-gate } }
spec:
  selector: { app: mlflow-gate }
  ports: [ { port: 80, targetPort: http, name: http } ]
