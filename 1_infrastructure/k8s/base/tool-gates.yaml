# headlamp-gate: fronts the Headlamp cluster console at /k8s on the admin host
# (path-routed beside the admin SPA). The gate does two things:
#   - per-role OIDC enforcement (403 for a non-ops login), and
#   - SA-bearer injection: INJECT_BEARER_FILE mounts the headlamp-token secret so
#     every proxied HTTP/WS request carries the console's identity (view, plus
#     edit in nhdw) and Headlamp opens without its token-paste screen.
# Websocket support in the gate carries Headlamp's live watch multiplexer.
apiVersion: apps/v1
kind: Deployment
metadata: { name: headlamp-gate, namespace: nhdw, labels: { app: headlamp-gate, tier: tool-sso } }
spec:
  replicas: 1
  selector: { matchLabels: { app: headlamp-gate } }
  template:
    metadata: { labels: { app: headlamp-gate, tier: tool-sso } }
    spec:
      containers:
        - name: gate
          image: nhdw-registry:5500/nhdw/tool-gate:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 80, name: http } ]
          env:
            - { name: TOOL_NAME,            value: "headlamp" }
            - { name: UPSTREAM_URL,         value: "http://headlamp.nhdw.svc.cluster.local:80" }
            - { name: ALLOWED_ROLES,        value: "R-OPS-ADM,R-OPS-ENG,R-OPS-SEC,R-SUPER" }
            - { name: OIDC_REALMS,          value: "privileged-ops,moh-staff" }
            - { name: OIDC_CLIENT_ID,       value: "headlamp" }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: headlamp-gate-secrets, key: OIDC_CLIENT_SECRET, optional: true } }
            # Headlamp is path-routed at /k8s on the admin host, so the gate's OIDC
            # legs and APP_BASE are the admin host; the deep-link button passes
            # rd=/k8s/ so the post-login redirect lands in the console.
            - { name: OIDC_REDIRECT_URI,    value: "https://admin.127.0.0.1.nip.io/oauth2gate/callback" }
            - { name: APP_BASE,             value: "https://admin.127.0.0.1.nip.io" }
            - { name: KEYCLOAK_BASE,        value: "http://keycloak.nhdw.svc.cluster.local:8080" }
            - { name: KEYCLOAK_PUBLIC_BASE, value: "https://keycloak.127.0.0.1.nip.io" }
            - { name: LOKI_URL,             value: "http://loki.nhdw.svc.cluster.local:3100" }
            # SA bearer the upstream (Headlamp) needs, injected on every request.
            - { name: INJECT_BEARER_FILE,   value: "/var/run/headlamp/token" }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: headlamp-gate-secrets, key: SESSION_SECRET, optional: true } }
          volumeMounts:
            - { name: sa-token, mountPath: /var/run/headlamp, readOnly: true }
          readinessProbe: { httpGet: { path: /oauth2gate/health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /oauth2gate/health, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
      volumes:
        # The auto-populated headlamp SA token (view, plus edit in nhdw).
        - name: sa-token
          secret:
            secretName: headlamp-token
            items: [ { key: token, path: token } ]
---
apiVersion: v1
kind: Service
metadata: { name: headlamp-gate, namespace: nhdw, labels: { app: headlamp-gate } }
spec:
  selector: { app: headlamp-gate }
  ports: [ { port: 80, targetPort: http, name: http } ]
