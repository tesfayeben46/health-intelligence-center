# Object-store S3 API (SeaweedFS), needed only for gateway-presigned browser downloads
# (ML result CSVs, exports, artifacts). The gateway signs against
# MINIO_PUBLIC_ENDPOINT (this host); data-plane access stays gateway-mediated.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ing-s3, namespace: nhdw }
spec:
  ingressClassName: traefik
  tls: [ { hosts: [ s3.127.0.0.1.nip.io ], secretName: nhdw-wildcard-tls } ]
  rules:
    - host: s3.127.0.0.1.nip.io
      http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: seaweedfs-s3, port: { number: 8333 } } } } ] }
---
# Observability UIs (operator-facing): the Prometheus expression browser and
# Alertmanager, each behind its tool gate (nhdw/tool-gate) with per-role OIDC
# (R-OPS-* / R-SUPER, either staff realm) and shared-session auto-login. Neither
# tool has its own authentication, so these routes never point at them directly.
# Loki has no UI (API only); it is reached in-cluster through the gateway's LOKI_URL.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ing-prometheus, namespace: nhdw }
spec:
  ingressClassName: traefik
  tls: [ { hosts: [ prometheus.127.0.0.1.nip.io ], secretName: nhdw-wildcard-tls } ]
  rules:
    - host: prometheus.127.0.0.1.nip.io
      http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: prometheus-gate, port: { number: 80 } } } } ] }
