# Ingress for the dev overlay: consistent HTTPS hostnames through nip.io
# (*.127.0.0.1.nip.io resolves to 127.0.0.1, so no hosts-file edits are needed).
# TLS terminates at Traefik with the nhdw-wildcard-tls Secret
# (bundle/scripts/gen-tls.sh). HTTPS is required so Keycloak's cross-origin
# session cookies (SameSite=None;Secure) survive the dashboard-to-Keycloak OIDC
# handshake.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ing-keycloak, namespace: nhdw }
spec:
  ingressClassName: traefik
  tls: [ { hosts: [ keycloak.127.0.0.1.nip.io ], secretName: nhdw-wildcard-tls } ]
  rules:
    - host: keycloak.127.0.0.1.nip.io
      http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: keycloak, port: { number: 8080 } } } } ] }
