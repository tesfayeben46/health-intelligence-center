# Headlamp (cluster console): /k8s on the admin host over TLS, so the dashboard's
# relative link works. Fronted by headlamp-gate (nhdw/tool-gate), which does both
# the per-role OIDC enforcement (R-OPS-* / R-SUPER) and the SA-bearer injection.
# The gate owns /oauth2gate/* (its OIDC legs) and /k8s (the proxied console) on
# this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ing-headlamp, namespace: nhdw }
spec:
  ingressClassName: traefik
  tls: [ { hosts: [ admin.127.0.0.1.nip.io ], secretName: nhdw-wildcard-tls } ]
  rules:
    - host: admin.127.0.0.1.nip.io
      http:
        paths:
          - path: /k8s
            pathType: Prefix
            backend: { service: { name: headlamp-gate, port: { number: 80 } } }
          - path: /oauth2gate
            pathType: Prefix
            backend: { service: { name: headlamp-gate, port: { number: 80 } } }
---
