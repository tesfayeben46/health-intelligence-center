# Ansible config for the NHDW deploy. Run from this directory:
#   ansible-playbook site.yml                         # uses inventory/single-node.yml (below)
#   ansible-playbook -i inventory/fleet.example.yml site.yml
[defaults]
inventory = inventory/single-node.yml
roles_path = roles
host_key_checking = False
# Built-in default callback: the `yaml` callback lives in a collection that ansible-core does
# not bundle, and the config stays runnable on a bare `pip install ansible-core` host.
stdout_callback = default
gathering = smart
# The deploy and seed roles shell out to bundle/scripts/*.sh (cluster boot, image load,
# seeding), which run for a long time; a short SSH timeout would cut them off.
timeout = 60

[ssh_connection]
pipelining = True
