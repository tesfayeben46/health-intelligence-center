# Cilium and Hubble values for the NHDW CNI install (k3s and k3d paths).
# Matches the flags bundle/scripts/bootstrap.sh passes via --set, as a values file so the
# hubble.metrics list needs no shell escaping.
operator:
  replicas: 1
  image: { pullPolicy: IfNotPresent, useDigest: false }
ipam:
  mode: kubernetes
image:
  pullPolicy: IfNotPresent
  # useDigest=false: otherwise the chart pins @sha256, bypasses the tag-imported bundle tars
  # and forces network pulls on a cold or offline boot.
  useDigest: false
# Embedded Envoy (no separate DaemonSet) means one fewer image to bundle.
envoy:
  enabled: false
prometheus:
  enabled: true
hubble:
  enabled: true
  relay:
    enabled: true
    image: { pullPolicy: IfNotPresent, useDigest: false }
  # Flow, TCP, drop and DNS metrics feed the per-pod flow data on the admin topology page.
  metrics:
    enabled:
      - "flow:sourceContext=workload-name|pod-name;destinationContext=workload-name|pod-name;labelsContext=source_namespace,destination_namespace"
      - "tcp:sourceContext=workload-name|pod-name;destinationContext=workload-name|pod-name;labelsContext=source_namespace,destination_namespace"
      - "drop:sourceContext=workload-name|pod-name;destinationContext=workload-name|pod-name;labelsContext=source_namespace,destination_namespace"
      - "dns"
