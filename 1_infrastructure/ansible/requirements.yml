# Ansible collections the provisioning roles use.
#
# `ansible-core` ships only ansible.builtin. Without these collections the playbook
# fails on its first task that uses one ("couldn't resolve module/action
# 'community.general.modprobe'"). Install with:
#
#   ansible-galaxy collection install -r requirements.yml
#
# The full `ansible` package bundles both; listing them here keeps the control
# node's dependencies explicit and reproducible.
collections:
  # community.general.modprobe: loads the kernel modules k3s and Cilium need
  - name: community.general
    version: ">=8.0.0"
  # ansible.posix.sysctl: the br_netfilter and ip_forward settings k3s requires
  - name: ansible.posix
    version: ">=1.5.0"
