# marts catalog: PostgreSQL connector to the nhdw_vault bi_* schemas, read-only as bi_reader.
connector.name=postgresql
connection-url=jdbc:postgresql://postgres-vault:5432/nhdw_vault
connection-user=bi_reader
connection-password=${ENV:BI_READER_PASSWORD}
case-insensitive-name-matching=true
postgresql.array-mapping=AS_ARRAY
