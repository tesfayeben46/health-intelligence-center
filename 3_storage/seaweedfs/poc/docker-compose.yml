# SeaweedFS compatibility test stack (local Docker Compose).
#
# Isolated: its own bridge network, no cluster attachment. The
# deployed object store is described in 3_storage/seaweedfs/README.md.
#
# The components are split as in the deployment (master / volume / filer with
# in-process S3), so the tests exercise the real topology instead of the
# `weed server` all-in-one mode, which hides failure modes.
#
# High ports (19333/18080/18888/18333) avoid the ports used by the local source
# systems (dhis2 on 8080, elmis on 5434, source replicas on 1433/33306/8093+).
services:
  master:
    image: chrislusf/seaweedfs:${SEAWEED_TAG:-latest}
    container_name: swpoc-master
    command: "master -ip=master -ip.bind=0.0.0.0 -volumeSizeLimitMB=64"
    ports: [ "19333:9333" ]
    networks: [ swpoc ]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  volume:
    image: chrislusf/seaweedfs:${SEAWEED_TAG:-latest}
    container_name: swpoc-volume
    # -max must exceed 7 volumes per bucket; -dir is the PVC equivalent in k8s.
    command: "volume -mserver=master:9333 -ip=volume -ip.bind=0.0.0.0 -port=8080 -dir=/data -max=200"
    depends_on:
      master: { condition: service_healthy }
    volumes: [ swpoc_volume:/data ]
    ports: [ "18080:8080" ]
    networks: [ swpoc ]

  filer:
    image: chrislusf/seaweedfs:${SEAWEED_TAG:-latest}
    container_name: swpoc-filer
    # Default filer store (leveldb2) for stage A. Stage B re-runs against the
    # PostgreSQL store separately, so a failure in one is never mistaken for a
    # failure in the other.
    # The filer serves S3 on 8333 in-process, as in the deployment.
    command: "filer -master=master:9333 -ip=filer -ip.bind=0.0.0.0 -port=8888 -s3 -s3.port=8333 -s3.ip.bind=0.0.0.0 -s3.config=/etc/seaweedfs/identities.json"
    depends_on:
      master: { condition: service_healthy }
    volumes:
      - swpoc_filer:/data
      - ./identities.json:/etc/seaweedfs/identities.json:ro
    ports: [ "18888:8888", "18333:8333" ]
    networks: [ swpoc ]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  swpoc:
    driver: bridge

volumes:
  swpoc_volume:
  swpoc_filer:
