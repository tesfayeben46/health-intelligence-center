- role: R-STEW
  dashboards:
  - public
  - internal-bi
  - workshop
  # admin: only the MDM stewardship page (governance and ops plane, no mart
  # reads, so the data-plane separation of duties below is unaffected). This is
  # the steward's decision console: the matcher's candidate queue and the
  # append-only decision log the vault build replays.
  - admin
  widgets:
    admin:
    - adm-classification
    - adm-mdm-review
    public:
    - pub-hero
    - pub-insights
    - pub-zm-supply
    - pub-newsroom
    - pub-region
    - pub-zm-kpi
    - pub-zm-province
    - pub-supply
    # The steward has no data-plane access by design (separation of duties,
    # r-stew.yaml): OPA denies every mart read for R-STEW, so any mart-bound
    # widget would render empty. The widget grants therefore match the policy:
    # only the non-mart widgets that render (the assistant, the governance audit
    # trail, user settings). The operational data pages (Overview, Disease,
    # Resource, Service) elide because no widgets are granted. The steward works
    # in the workshop (catalog, lineage, model governance) below and in admin
    # governance. Giving stewards aggregate health reads would be an OPA change
    # (widen r-stew.yaml), not a grant change.
    internal-bi:
    - bi-assistant
    - ex-audit-trail
    - st-alert-subs
    - st-display
    - st-profile
    - st-security
    workshop:
    - ws-datasets-table
    - ws-models-table
    - ws-help-guides
    - ws-settings-profile
