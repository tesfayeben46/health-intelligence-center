# NHDW login theme, without PatternFly.
# parent=base provides the message bundles and the FreeMarker login model
# (url/realm/social/messagesPerField) while the theme's template.ftl and
# login.ftl own the entire markup, so the stylesheet styles plain semantic
# classes. Extending keycloak.v2 instead would mean overriding PatternFly's
# compiled styles.
parent=base

# The only stylesheet loaded; the versioned name busts browser caches on redesign.
styles=css/brand.v3.css
